[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["despesas"]

[project]
name = "conciliador-despesas"
version = "0.1.0"
description = "Conciliador de despesas pessoais com divisão entre pessoas, para usar com o seu próprio LLM"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["pyyaml>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
